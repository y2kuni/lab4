<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proxy Traffic</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --border: #dde1e7; --text: #1d2330; --muted: #657085;
  --faint: #9aa3b2; --accent: #2f6fde; --accent-bg: #e6eefc; --sel: #e9f0fd; --hover: #f3f6fa;
  --you: #2f6fde; --you-bg: #eaf1fd; --harness: #7a8394; --harness-bg: #f1f2f4;
  --model: #7b45c8; --model-bg: #f4eefc; --think: #8a7fa3; --think-bg: #f5f3f8;
  --call: #b5660b; --call-bg: #fdf3e6; --result: #13817a; --result-bg: #e7f6f4;
  --err: #cc2b3b; --err-bg: #fdecee; --sys: #8a5a2b; --sys-bg: #f8f1e9; --ok: #1f8a4c; --warn: #b07a00;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --row: 50px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1a1e26; --panel-2: #212631; --border: #2e3440; --text: #e3e7ee; --muted: #9aa4b5;
    --faint: #6b7486; --accent: #6ea2ff; --accent-bg: #1e2b44; --sel: #1f2a3d; --hover: #1f242e;
    --you: #6ea2ff; --you-bg: #1b2740; --harness: #8d96a6; --harness-bg: #22262e;
    --model: #b28cf0; --model-bg: #261f35; --think: #a69cc0; --think-bg: #23202b;
    --call: #e5a04f; --call-bg: #2e2416; --result: #4cc5bb; --result-bg: #152b2a;
    --err: #ff6b78; --err-bg: #3a1c21; --sys: #d1a06c; --sys-bg: #2c2319; --ok: #4fc47f; --warn: #e0b040;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1a1e26; --panel-2: #212631; --border: #2e3440; --text: #e3e7ee; --muted: #9aa4b5;
  --faint: #6b7486; --accent: #6ea2ff; --accent-bg: #1e2b44; --sel: #1f2a3d; --hover: #1f242e;
  --you: #6ea2ff; --you-bg: #1b2740; --harness: #8d96a6; --harness-bg: #22262e;
  --model: #b28cf0; --model-bg: #261f35; --think: #a69cc0; --think-bg: #23202b;
  --call: #e5a04f; --call-bg: #2e2416; --result: #4cc5bb; --result-bg: #152b2a;
  --err: #ff6b78; --err-bg: #3a1c21; --sys: #d1a06c; --sys-bg: #2c2319; --ok: #4fc47f; --warn: #e0b040;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
button:hover { border-color: var(--faint); }
button.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
code, pre, .mono { font-family: var(--mono); font-size: 12px; }
pre { margin: 0; white-space: pre-wrap; word-break: break-word; }

/* header */
#hdr { display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
#hdr h1 { font-size: 14px; margin: 0; font-weight: 600; }
#conn { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
#conn i { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); display: inline-block; }
#conn.live i { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
#conn.reconnecting i { background: var(--warn); }
#conn.offline i { background: var(--err); }
#totals { color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
#totals b { color: var(--text); font-weight: 600; }
#totals .err b { color: var(--err); }
#hdr .sp { flex: 1; }

/* panes */
#main { flex: 1; display: grid; grid-template-columns: minmax(300px, 34%) 1fr; min-height: 0; }
#left { display: flex; flex-direction: column; border-right: 1px solid var(--border); min-height: 0; background: var(--panel); }
#tlbar { padding: 6px 10px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; align-items: center; color: var(--muted); }
#tlwrap { position: relative; flex: 1; min-height: 0; }
#tl { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; }
#tl-inner { position: relative; }
#pill { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 2; background: var(--accent); color: #fff; border: 0; border-radius: 99px; padding: 3px 12px; display: none; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
#empty { padding: 24px 16px; color: var(--muted); }
.row { position: absolute; left: 0; right: 0; height: var(--row); padding: 5px 10px 5px 12px; border-bottom: 1px solid var(--border); border-left: 3px solid transparent; cursor: pointer; overflow: hidden; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); border-left-color: var(--accent); }
.row.err { border-left-color: var(--err); }
.row .l1, .row .l2 { display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; }
.row .l2 { color: var(--muted); font-size: 12px; margin-top: 2px; }
.row .id { font-family: var(--mono); color: var(--muted); min-width: 34px; }
.row .what { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.row .nums { color: var(--faint); font-size: 11px; font-family: var(--mono); }
.chip { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11px; line-height: 17px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); white-space: nowrap; }
.chip.err { background: var(--err-bg); color: var(--err); border-color: color-mix(in srgb, var(--err) 35%, transparent); }
.chip.warn { color: var(--warn); }
.spin { width: 10px; height: 10px; border: 2px solid var(--faint); border-top-color: var(--accent); border-radius: 50%; display: inline-block; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* detail */
#right { overflow-y: auto; min-height: 0; }
#detail { padding: 14px 20px 40px; max-width: 1200px; }
#detail .placeholder { color: var(--muted); padding: 30px 0; }
.dhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.dhead h2 { font-size: 15px; margin: 0; }
.dhead .meta { color: var(--muted); }
#back { display: none; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 12px 0; flex-wrap: wrap; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 10px; color: var(--muted); }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); background: none; }
.sec { margin: 14px 0; }
.sec > h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; display: flex; gap: 8px; align-items: center; }
.box { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; }
.kv > div:nth-child(odd) { color: var(--muted); }
.kv > div { min-width: 0; overflow-wrap: anywhere; }
.errbox { background: var(--err-bg); border: 1px solid var(--err); color: var(--text); border-radius: 8px; padding: 10px 12px; }
.errbox b { color: var(--err); }
.scrollx { overflow-x: auto; }
pre.code { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; white-space: pre; overflow-x: auto; max-height: 70vh; overflow-y: auto; }
.copy { font-size: 11px; padding: 0 7px; }
.evt { border-top: 1px dashed var(--border); padding: 4px 0; display: grid; grid-template-columns: 34px 170px 1fr; gap: 8px; }
.evt:first-child { border-top: 0; }
.evt .n { color: var(--faint); font-family: var(--mono); }
.evt .name { font-family: var(--mono); color: var(--accent); overflow: hidden; text-overflow: ellipsis; }
.evt pre { white-space: pre-wrap; word-break: break-all; }
table.hdrs { border-collapse: collapse; width: 100%; }
table.hdrs td { padding: 2px 8px 2px 0; vertical-align: top; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
table.hdrs td:first-child { color: var(--muted); white-space: nowrap; width: 1%; }
.muted { color: var(--muted); }

/* message blocks (kind vocabulary, SPEC §5.2) */
.blk { border: 1px solid var(--border); border-left: 3px solid var(--k, var(--border)); background: var(--kb, var(--panel)); border-radius: 6px; margin: 6px 0; }
.blk > .bh { display: flex; gap: 8px; align-items: center; padding: 4px 10px; font-size: 12px; color: var(--muted); }
.blk > .bh .lbl { color: var(--k); font-weight: 600; }
.blk > .bb { padding: 2px 10px 8px; }
.k-you { --k: var(--you); --kb: var(--you-bg); }
.k-harness { --k: var(--harness); --kb: var(--harness-bg); }
.k-model { --k: var(--model); --kb: var(--model-bg); }
.k-think { --k: var(--think); --kb: var(--think-bg); }
.k-call { --k: var(--call); --kb: var(--call-bg); }
.k-result { --k: var(--result); --kb: var(--result-bg); }
.k-err { --k: var(--err); --kb: var(--err-bg); }
.k-sys { --k: var(--sys); --kb: var(--sys-bg); }

.blk > .bh .sp, .mh .sp { flex: 1; }
.blk > .bh .sz { color: var(--faint); font-size: 11px; white-space: nowrap; }
.blk > .bh { flex-wrap: wrap; }
.blk.k-other { --k: var(--muted); }
.blk .tid { color: var(--faint); font-size: 11px; }
details.thinking > summary { cursor: pointer; list-style: none; }
details.thinking > summary::-webkit-details-marker { display: none; }
details.thinking:not([open]) > summary::after { content: "▸ show"; color: var(--faint); font-size: 11px; }
pre.txt { white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12px; }
pre.txt.cmd { background: var(--panel-2); border-radius: 4px; padding: 4px 8px; margin-bottom: 6px; }
.clip { position: relative; }
.clipped { position: relative; max-height: 19em; overflow: hidden; }
.clipped::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3em; background: linear-gradient(transparent, var(--kb, var(--panel))); pointer-events: none; }
button.more { margin-top: 4px; font-size: 11px; padding: 1px 8px; background: var(--panel); }
button.more.inline { margin: 0 0 0 6px; }
.ln { font-family: var(--mono); font-size: 12px; }
.lnr { display: flex; white-space: pre; }
.lnr .g { color: var(--faint); min-width: 3.5em; text-align: right; padding-right: 10px; user-select: none; flex: none; }
.diff .da { color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, transparent); }
.diff .dd { color: var(--err); background: color-mix(in srgb, var(--err) 10%, transparent); }
.diff .dh { color: var(--accent); }
.md { overflow-wrap: anywhere; }
.md p { margin: 0 0 8px; white-space: pre-wrap; }
.md ul, .md ol { margin: 0 0 8px; padding-left: 22px; }
.md code { background: color-mix(in srgb, var(--text) 8%, transparent); padding: 0 4px; border-radius: 3px; }
.md .fence { position: relative; margin: 0 0 8px; }
.md .fence .lang { position: absolute; right: 8px; top: 4px; font-size: 10px; color: var(--faint); }
.md .fence pre.code { max-height: none; }
.md blockquote { margin: 0 0 8px; padding-left: 10px; border-left: 3px solid var(--border); color: var(--muted); }
.md .mdh { font-weight: 600; margin: 8px 0 4px; }
.md .mdh1 { font-size: 16px; } .md .mdh2 { font-size: 15px; } .md .mdh3 { font-size: 14px; }
.md a { color: var(--accent); }
.md hr { border: 0; border-top: 1px solid var(--border); }
.jv { font-family: var(--mono); font-size: 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; overflow-x: auto; position: relative; }
.jvbar { position: absolute; right: 6px; top: 4px; }
.jt > summary { cursor: pointer; list-style: none; }
.jt > summary::-webkit-details-marker { display: none; }
.jt > summary::before { content: "▸ "; color: var(--faint); }
.jt[open] > summary::before { content: "▾ "; }
.sec > h3 .sz, .sec > h3 .chip { text-transform: none; letter-spacing: 0; }
.jc { padding-left: 16px; border-left: 1px dotted var(--border); margin-left: 4px; }
.jr { white-space: pre-wrap; word-break: break-word; }
.jk { color: var(--muted); }
.js { color: var(--result); } .jn { color: var(--call); } .jb { color: var(--model); } .jnull { color: var(--faint); }
.jp { color: var(--faint); }
.jnote { color: var(--faint); font-style: italic; margin-right: 6px; }
img.thumb { max-width: 220px; max-height: 160px; border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in; display: block; }
img.thumb.big { max-width: 100%; max-height: none; cursor: zoom-out; }
.pair { margin: 0 8px 8px 22px; }
.pair:empty { display: none; }
.pair .blk { margin: 0; }
.awaiting { color: var(--warn); font-size: 12px; padding: 2px 0; }
.ptr { font-size: 12px; color: var(--k); padding: 3px 10px; border-left: 3px solid var(--k); margin: 4px 0; opacity: .8; }
.msg { margin: 10px 0 14px; }
.mh { display: flex; gap: 8px; align-items: center; font-size: 12px; margin-bottom: 2px; }
.role { font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .05em; }
.role.r-user { color: var(--you); } .role.r-assistant { color: var(--model); }
.earlier { display: flex; gap: 8px; margin: 6px 0 10px; }
.earlier button { flex: 0 0 auto; }
.replyhead { display: flex; gap: 8px; align-items: center; margin: 18px 0 4px; padding-top: 10px; border-top: 2px solid var(--border); font-weight: 600; }
.usage { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin: 6px 0; }
.usage b { color: var(--text); font-weight: 600; }
a.chip.link { color: var(--accent); text-decoration: none; cursor: pointer; }
a.chip.link:hover { border-color: var(--accent); }
input.search { width: 100%; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; margin-bottom: 8px; }
.tools details.tool { border: 1px solid var(--border); border-radius: 6px; margin: 4px 0; background: var(--panel); }
.tools summary { display: flex; gap: 10px; align-items: baseline; padding: 6px 10px; cursor: pointer; flex-wrap: wrap; }
.tools .tname { font-weight: 600; }
.tools .tdesc { color: var(--muted); flex: 1; min-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tools .tparams { display: flex; gap: 4px; flex-wrap: wrap; }
.tools .chip.req { color: var(--text); font-weight: 600; }
.tools .tbody { padding: 0 10px 8px; }
.errh { font-size: 11px; margin-top: 6px; color: var(--muted); }
.errbox { margin-bottom: 8px; }

@media (max-width: 900px) {
  #main { grid-template-columns: 1fr; }
  #right { display: none; }
  body.detail-open #left { display: none; }
  body.detail-open #right { display: block; }
  #back { display: inline-block; }
  #detail { padding: 12px 16px 40px; }
  #hdr { padding: 8px 16px; }
  .evt { grid-template-columns: 28px 1fr; }
  .evt pre { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<header id="hdr">
  <h1>Proxy Traffic</h1>
  <span id="conn" class="offline" title="connection to the proxy"><i></i><span>offline</span></span>
  <span id="totals"></span>
  <span class="sp"></span>
  <button id="btn-follow" class="on" title="keep the newest exchange selected (f)">Follow</button>
  <button id="btn-pause" title="freeze the view; events keep buffering (p)">Pause</button>
</header>
<div id="main">
  <section id="left">
    <div id="tlbar"><span id="tlcount">0 exchanges</span></div>
    <div id="tlwrap">
      <button id="pill"></button>
      <div id="tl"><div id="tl-inner"></div><div id="empty">Waiting for traffic. Point the agent at the proxy: <code>ANTHROPIC_BASE_URL=http://localhost:8041 claude</code></div></div>
    </div>
  </section>
  <section id="right"><div id="detail"><div class="placeholder">Select an exchange on the left.</div></div></section>
</div>
<script>
"use strict";
// SECURITY (SPEC C5): recorded content is untrusted. It is only ever inserted as text
// (textContent / text nodes via el()). Nothing here parses strings as markup.

// ---------- helpers ----------
const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "text") n.textContent = v;
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return n;
}
const fmtN = n => n == null ? "–" : n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + "k" : String(n);
const fmtMs = ms => ms == null ? "–" : ms < 1000 ? Math.round(ms) + "ms" : (ms / 1000).toFixed(ms < 10000 ? 1 : 0) + "s";
function fmtAgo(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (!isFinite(s)) return "";
  if (s < 5) return "now"; if (s < 60) return Math.round(s) + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago"; if (s < 86400) return Math.round(s / 3600) + "h ago";
  return new Date(iso).toLocaleDateString();
}
const absTime = iso => new Date(iso).toLocaleString();
async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(url + " → " + r.status);
  return r.json();
}
function copyText(text, btn) {
  const done = () => { if (btn) { const t = btn.textContent; btn.textContent = "copied"; setTimeout(() => btn.textContent = t, 900); } };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback() { const ta = el("textarea", { style: "position:fixed;opacity:0" }); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) {} ta.remove(); }
}
const copyBtn = getText => el("button", { class: "copy", title: "copy", onclick: e => { e.stopPropagation(); copyText(getText(), e.currentTarget); } }, "copy");
function prettyMaybeJSON(text) { try { return JSON.stringify(JSON.parse(text), null, 2); } catch (e) { return text; } }
function inTokens(u) { return u ? (u.input_tokens || 0) + (u.cache_creation_input_tokens || 0) + (u.cache_read_input_tokens || 0) : 0; }

// ---------- state ----------
const S = {
  ex: new Map(),        // id -> summary
  order: [],            // ids, newest first
  selected: null,
  full: new Map(),      // id -> full exchange (fetched on demand)
  live: new Map(),      // id -> reply being built from exchange.delta notes
  seq: 0,
  follow: true, paused: false, buffer: [],
  tab: "conversation",
  toolQuery: "",
  config: {},
  newCount: 0,
};

// ---------- connection (SPEC §3.2, §6) ----------
let es = null, backoff = 500, reconnectTimer = null;
function setConn(state) { const c = $("#conn"); c.className = state; c.lastElementChild.textContent = state; }
async function loadAll() {
  const data = await getJSON("/api/exchanges");
  S.ex.clear(); S.order = [];
  for (const s of data.exchanges) S.ex.set(s.id, s);
  S.order = [...S.ex.keys()].sort((a, b) => b - a);
  S.seq = data.seq;
  if (S.follow && S.order.length) S.selected = S.order[0];
  renderAll();
}
function connect() {
  if (es) es.close();
  clearTimeout(reconnectTimer);
  es = new EventSource("/api/events?last=" + S.seq);
  es.onopen = () => { backoff = 500; setConn(S.config.mode === "load" ? "live" : "live"); };
  es.onerror = () => {
    es.close(); es = null;
    setConn(backoff > 4000 ? "offline" : "reconnecting");
    reconnectTimer = setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 15000);
  };
  for (const t of ["exchange.start", "exchange.delta", "exchange.end", "exchange.error", "resync"])
    es.addEventListener(t, e => {
      S.seq = Math.max(S.seq, Number(e.lastEventId) || 0);
      const ev = { type: t, data: JSON.parse(e.data) };
      if (S.paused && t !== "resync") { S.buffer.push(ev); updatePauseBtn(); } else handle(ev);
    });
}
function handle(ev) {
  const d = ev.data;
  switch (ev.type) {
    case "resync": loadAll().catch(console.error); return;
    case "exchange.start": upsert(d, true); break;
    case "exchange.delta": applyNotes(d.id, d.notes); break;
    case "exchange.end": case "exchange.error":
      upsert(d, false); S.live.delete(d.id); S.full.delete(d.id);
      if (S.selected === d.id) renderDetail();
      break;
  }
}
function upsert(summary, isNew) {
  const had = S.ex.has(summary.id);
  S.ex.set(summary.id, summary);
  if (!had) {
    S.order.unshift(summary.id);

    const line = lines[i];
    const fence = line.match(/^\s*(```+|~~~+)\s*([\w+#.-]*)/);

      const buf = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith(fence[1])) buf.push(lines[i++]);
      i++;

    }).catch(() => box.replaceChildren(exLink(link.result_ex, "result arrived in")));
  } else if (ctx.awaiting !== false) {
    box.append(el("div", { class: "awaiting" }, "⧗ awaiting result"));
  }
  return box;
}

// ---------- detail (SPEC §5.4) ----------
const TABS = [
  { id: "conversation", label: () => "Conversation", render: renderConversation },
  { id: "system", label: f => `System${f && f.request.system ? " " + f.request.system.length : ""}`, render: renderSystem },
  { id: "tools", label: f => `Tools${f && f.request.tools ? " " + f.request.tools.length : ""}`, render: renderTools },
  { id: "reply", label: () => "Reply", render: renderReplyTab },
  { id: "params", label: () => "Request", render: renderParams },
  { id: "raw", label: () => "Raw", render: renderRaw },
];
S.tab = "conversation";
let detailToken = 0;
async function renderDetail() {
  const id = S.selected, box = $("#detail"), token = ++detailToken;
  if (id == null) { box.replaceChildren(el("div", { class: "placeholder" }, "Select an exchange on the left.")); return; }
  const s = S.ex.get(id); if (!s) return;
  let full = S.full.get(id);
  if (!full) {
    try { full = await getJSON("/api/exchanges/" + id); if (s.state !== "streaming" && s.state !== "pending") S.full.set(id, full); } catch (e) { full = null; }
    if (token !== detailToken) return;
  }
  const scrollY = $("#right").scrollTop, sameEx = box.dataset.ex === String(id);
  const isMsg = s.kind !== "other";
  const tabs = isMsg ? TABS : TABS.filter(t => t.id === "params" || t.id === "raw");
  const tab = tabs.find(t => t.id === S.tab) || (isMsg ? tabs[0] : tabs.find(t => t.id === "params"));
  const head = el("div", { class: "dhead" },
    el("button", { id: "back", onclick: () => { document.body.classList.remove("detail-open"); scheduleTimeline(); } }, "← Back"),
    el("h2", null, `Exchange #${id}`),
    el("span", { class: "meta" }, [s.thread, s.model, s.status, fmtMs(s.t && s.t.total_ms)].filter(Boolean).join(" · ")),
    s.state === "streaming" || s.state === "pending" ? el("span", { class: "spin" }) : null,
    ...(s.badges || []).map(b => el("span", { class: "chip warn" }, b)));
  const tabBar = el("div", { class: "tabs" }, tabs.map(t => el("button", { class: tab.id === t.id ? "on" : "", onclick: () => { S.tab = t.id; renderDetail(); } }, t.label(full))));
  const body = el("div", { id: "tabbody" });
  const err = s.error ? el("div", { class: "errbox" }, el("b", null, "✗ Error  "), s.error, errorExtras(full)) : null;
  box.dataset.ex = id;
  box.replaceChildren(head, err || "", tabBar, body);
  if (!full) { body.append(el("div", { class: "muted" }, "Could not load this exchange.")); return; }
  await tab.render(s, full, body, token);
  if (sameEx) $("#right").scrollTop = scrollY;
}
function errorExtras(full) {
  if (!full || !full.response) return null;
  const pick = (full.response.headers || []).filter(([k]) => /^(retry-after|anthropic-ratelimit-|x-should-retry|request-id)/i.test(k));
  return pick.length ? el("div", { class: "mono errh" }, pick.map(([k, v]) => el("div", null, `${k}: ${v}`))) : null;
}

const convShown = new Map();   // exchange id -> index of first visible message
async function renderConversation(s, full, body, token) {
  const req = full.request;
  body.append(el("div", { class: "muted" }, "Loading messages…"));
  let msgs;
  try { msgs = await blobs(req.messages); } catch (e) { body.replaceChildren(el("div", { class: "errbox" }, "Could not load messages: " + e)); return; }
  if (token !== detailToken) return;
  const names = new Map(), results = new Map(), callAt = new Map();
  msgs.forEach((m, i) => contentOf(m).forEach(b => {
    if (b.type && b.type.endsWith("tool_use")) { names.set(b.id, b.name); callAt.set(b.id, i); }
    if (b.type === "tool_result") results.set(b.tool_use_id, { block: b, index: i });
  }));
  const reply = full.reply || S.live.get(s.id);
  for (const b of (reply && reply.content) || []) if (b.type && b.type.endsWith("tool_use")) names.set(b.id, b.name);
  const n = msgs.length;
  const dflt = Math.max(0, Math.min(req.new_from > 0 ? req.new_from - 1 : n - 4, n - 1));
  const start = Math.max(0, Math.min(convShown.has(s.id) ? convShown.get(s.id) : dflt, n));
  const ctx = { names, results, links: full.links || {}, exId: s.id };
  const parts = [];
  if (start > 0) {
    parts.push(el("div", { class: "earlier" },
      el("button", { onclick: () => { convShown.set(s.id, Math.max(0, start - 10)); renderDetail(); } }, `${start} earlier message${start === 1 ? "" : "s"} ▸`),
      start > 10 ? el("button", { onclick: () => { convShown.set(s.id, 0); renderDetail(); } }, "show all") : null));
  }
  for (let i = start; i < n; i++) parts.push(renderMessage(msgs[i], i, ctx, start, callAt));
  parts.push(el("div", { class: "replyhead" }, el("span", null, "Reply to this request"), reply && reply.stop_reason ? el("span", { class: "chip" }, "stop: " + reply.stop_reason) : null));
  parts.push(el("div", { id: "replysec" }));
  body.replaceChildren(...parts);
  fillReply(s, full);
}

function renderMessage(m, i, ctx, start, callAt) {
  const role = m.role || "?";
  const blocks = contentOf(m);
  const parts = [];
  blocks.forEach((b, j) => {
    // A result whose call is shown above is drawn under that call; here it is a one-line pointer.
    if (b.type === "tool_result" && callAt.has(b.tool_use_id) && callAt.get(b.tool_use_id) >= start) {
      parts.push(el("div", { class: `ptr ${b.is_error ? "k-err" : "k-result"}` }, `${b.is_error ? "✗" : "◧"} Result · ${ctx.names.get(b.tool_use_id) || "?"} — shown under its call ↑`));
      return;
    }
    parts.push(renderBlock(b, Object.assign({ role }, ctx), `${ctx.exId}:${i}:${j}`));
  });
  const anchor = `m${ctx.exId}-${i}`;
  return el("div", { class: "msg", id: anchor, "data-i": i },
    el("div", { class: "mh" }, el("span", { class: "role r-" + role }, role), el("span", { class: "mono muted" }, "#" + i),
      el("span", { class: "sp" }), copyBtn(() => blocks.map(b => b.text || textOfResult(b) || (b.input ? JSON.stringify(b.input) : "")).filter(Boolean).join("\n\n")),
      rawToggle(m, () => el("div", null, parts))),
    el("div", { class: "mb" }, parts));
}
function rawToggle(value, normal) {
  return el("button", { class: "copy", title: "raw JSON", onclick: e => {
    e.stopPropagation(); const btn = e.currentTarget, mb = btn.closest(".msg").querySelector(".mb");
    const on = !btn.classList.contains("on"); btn.classList.toggle("on", on);
    mb.replaceChildren(on ? jsonView(value) : normal());
  } }, "raw");
}

let liveQueued = false;
function scheduleLiveReply() {
  if (liveQueued) return; liveQueued = true;
  requestAnimationFrame(() => { liveQueued = false; const s = S.ex.get(S.selected); if (s && (S.tab === "conversation" || S.tab === "reply")) fillReply(s, S.full.get(s.id)); });
}
function fillReply(s, full) {
  const sec = $("#replysec"); if (!sec) return;
  const reply = (full && full.reply && s.state !== "streaming") ? full.reply : (S.live.get(s.id) || (full && full.reply));
  const parts = [];
  if (!reply) parts.push(el("div", { class: "muted" }, s.state === "done" || s.state === "error" || s.state === "aborted" ? "No reply." : "Waiting for the reply…"));
  else if (reply.count) parts.push(el("div", { class: "box" }, `input_tokens: ${reply.count.input_tokens}`));
  else {
    const names = new Map();
    (reply.content || []).forEach(b => { if (b && b.id) names.set(b.id, b.name); });
    const ctx = { role: "assistant", names, results: new Map(), links: (full && full.links) || {}, exId: s.id };
    (reply.content || []).forEach((b, i) => { if (b) parts.push(renderBlock(b, ctx, `${s.id}:reply:${i}`)); });
    if (reply.error) parts.push(el("div", { class: "errbox" }, el("b", null, "✗ Stream error  "), JSON.stringify(reply.error)));
    if (reply.usage) parts.push(usageLine(reply.usage));
  }
  sec.replaceChildren(...parts);
}
function usageLine(u) {
  return el("div", { class: "usage mono" },
    el("span", null, "in ", el("b", null, fmtN(u.input_tokens || 0)), " uncached"),
    el("span", null, el("b", null, fmtN(u.cache_creation_input_tokens || 0)), " cache write"),
    el("span", null, el("b", null, fmtN(u.cache_read_input_tokens || 0)), " cache read"),
    el("span", null, "out ", el("b", null, fmtN(u.output_tokens || 0))));
}

async function renderReplyTab(s, full, body) {
  const reply = full.reply || S.live.get(s.id);
  body.append(el("div", { class: "sec" }, el("h3", null, "Reply", reply && reply.stop_reason ? el("span", { class: "chip" }, "stop: " + reply.stop_reason) : null, reply && reply.id ? el("span", { class: "mono muted" }, reply.id) : null), el("div", { id: "replysec" })));
  fillReply(s, full);
}

async function renderSystem(s, full, body, token) {
  const sys = await blobs(full.request.system);
  if (token !== detailToken) return;
  if (!sys.length) { body.append(el("div", { class: "muted" }, "No system prompt.")); return; }
  const total = sys.reduce((a, b) => a + (b.text || "").length, 0);
  body.append(el("div", { class: "muted sec" }, `${sys.length} block${sys.length === 1 ? "" : "s"} · ${sizeInfo(sys.map(b => b.text || "").join("\n"))}`));
  sys.forEach((b, i) => {
    const text = b.text || JSON.stringify(b);
    body.append(blockShell("sys", `📜 System · block ${i + 1}`, {
      raw: b, size: sizeInfo(text), copy: () => text,
      extra: b.cache_control ? el("span", { class: "chip" }, "cache_control: " + (b.cache_control.type || "") + (b.cache_control.ttl ? " " + b.cache_control.ttl : "")) : null,
    }, () => collapsible(text, `sys:${full.request.system[i]}`, prePlain)));
  });
}

async function renderTools(s, full, body, token) {
  const tools = await blobs(full.request.tools);
  if (token !== detailToken) return;
  if (!tools.length) { body.append(el("div", { class: "muted" }, "No tools in this request.")); return; }
  const q = el("input", { class: "search", type: "search", placeholder: `Search ${tools.length} tools…`, value: S.toolQuery || "" });
  const list = el("div", { class: "tools" });
  const draw = () => {
    const needle = (q.value || "").toLowerCase();
    S.toolQuery = q.value;
    list.replaceChildren(...tools.map((t, i) => [t, i]).filter(([t]) => !needle || (t.name || "").toLowerCase().includes(needle) || (t.description || "").toLowerCase().includes(needle)).map(([t, i]) => {
      const props = Object.keys((t.input_schema && t.input_schema.properties) || {});
      const req = new Set((t.input_schema && t.input_schema.required) || []);
      const desc = t.description || "";
      return el("details", { class: "tool", open: expanded.get("tool:" + t.name) || null, ontoggle: e => expanded.set("tool:" + t.name, e.currentTarget.open) },
        el("summary", null, el("span", { class: "tname mono" }, t.name || t.type || "?"),
          el("span", { class: "tdesc" }, desc.split("\n")[0]),
          el("span", { class: "tparams" }, props.map(p => el("span", { class: "chip" + (req.has(p) ? " req" : ""), title: req.has(p) ? "required" : "optional" }, p)))),
        el("div", { class: "tbody" },
          el("div", { class: "sec" }, el("h3", null, "Description", el("span", { class: "sz" }, sizeInfo(desc)), copyBtn(() => desc)), collapsible(desc, "tooldesc:" + t.name, prePlain)),
          el("div", { class: "sec" }, el("h3", null, "input_schema"), jsonView(t.input_schema || t))));
    }));
  };
  q.addEventListener("input", draw);
  draw();
  body.append(q, list);
}

function renderParams(s, full, body) {
  const r = full.request;
  const betas = (r.headers || []).filter(([k]) => k.toLowerCase() === "anthropic-beta").map(([, v]) => v).join(",");
  const rows = [];
  const add = (k, v) => rows.push(el("div", null, k), el("div", null, v));
  add("endpoint", `${full.method} ${full.path}`);
  add("kind", full.kind);
  if (r.model) add("model", r.model);
  if (r.max_tokens != null) add("max_tokens", String(r.max_tokens));
  if (r.stream != null) add("stream", String(r.stream));
  if (betas) add("anthropic-beta", el("div", null, betas.split(",").map(b => el("span", { class: "chip" }, b.trim()))));
  const ua = (r.headers || []).find(([k]) => k.toLowerCase() === "user-agent");
  if (ua) add("user-agent", ua[1]);
  add("timing", `connect ${fmtMs(full.t.connected_ms)} · first byte ${fmtMs(full.t.ttfb_ms)} · total ${fmtMs(full.t.total_ms)}`);
  add("started", absTime(full.t.start));
  add("sizes", `request ${fmtN(r.size)} B · response ${fmtN(full.response.size)} B`);
  if (r.parse_error) add("parse", el("span", { class: "chip err" }, r.parse_error));
  body.append(el("div", { class: "sec" }, el("h3", null, "Request"), el("div", { class: "box kv" }, rows)));
  for (const k of ["thinking", "metadata"]) if (r[k] !== undefined) body.append(el("div", { class: "sec" }, el("h3", null, k), jsonView(r[k])));
  if (r.params && Object.keys(r.params).length) body.append(el("div", { class: "sec" }, el("h3", null, "Other parameters"), jsonView(r.params)));
  if (r.json !== undefined) body.append(el("div", { class: "sec" }, el("h3", null, "Body (not a Messages API call)"), jsonView(r.json)));
}

async function renderRaw(s, full, body, token) {
  body.append(el("div", { class: "muted" }, "Loading raw…"));
  let raw;
  try { raw = await getJSON(`/api/exchanges/${s.id}/raw`); } catch (e) { body.replaceChildren(el("div", { class: "errbox" }, String(e))); return; }
  if (token !== detailToken) return;
  const hdrTable = h => el("table", { class: "hdrs" }, h.map(([k, v]) => el("tr", null, el("td", null, k), el("td", null, v))));
  const hdrText = h => h.map(([k, v]) => `${k}: ${v}`).join("\n");
  const reqBody = prettyMaybeJSON(raw.request_body);
  const sec = (title, copy, ...kids) => el("div", { class: "sec" }, el("h3", null, title, copy ? copyBtn(copy) : null), ...kids);
  const parts = [
    sec("Request headers (redacted)", () => hdrText(raw.request_headers), el("div", { class: "box scrollx" }, hdrTable(raw.request_headers))),
    sec("Request body", () => raw.request_body,
      raw.request_reconstructed ? el("div", { class: "muted" }, "Rebuilt from stored blocks; the exact bytes are kept only for recent exchanges.") : null,
      el("pre", { class: "code" }, reqBody || "(empty)")),
    sec(`Response headers · ${raw.status ?? "–"} ${raw.reason ?? ""}`, () => hdrText(raw.response_headers), el("div", { class: "box scrollx" }, hdrTable(raw.response_headers))),
  ];
  const events = parseSSE(raw.response_body);
  if (events.length) {
    parts.push(sec(`Response · ${events.length} SSE events`, () => raw.response_body,
      el("div", { class: "box" }, events.map((e, i) => el("div", { class: "evt" }, el("span", { class: "n" }, i + 1), el("span", { class: "name" }, e.event), el("pre", null, e.data))))));
  } else {
    parts.push(sec("Response body", () => raw.response_body, el("pre", { class: "code" }, prettyMaybeJSON(raw.response_body) || "(empty)")));
  }
  body.replaceChildren(...parts);
}
function parseSSE(text) {
  if (!text || !/^(event|data):/m.test(text)) return [];
  const out = [];
  for (const block of text.replace(/\r\n/g, "\n").split("\n\n")) {
    if (!block.trim()) continue;
    let name = "message"; const data = [];
    for (const line of block.split("\n")) {
      if (line.startsWith("event:")) name = line.slice(6).trim();
      else if (line.startsWith("data:")) data.push(line.slice(5).replace(/^ /, ""));
    }
    out.push({ event: name, data: data.join("\n") });
  }
  return out;
}

function renderAll() { renderTotals(); renderTimeline(); renderDetail(); }

// ---------- wiring ----------
$("#tl").addEventListener("scroll", scheduleTimeline, { passive: true });
new ResizeObserver(scheduleTimeline).observe($("#tl"));
$("#pill").addEventListener("click", () => { $("#tl").scrollTop = 0; S.newCount = 0; scheduleTimeline(); });
$("#btn-follow").addEventListener("click", () => setFollow(!S.follow));
$("#btn-pause").addEventListener("click", () => setPaused(!S.paused));
document.addEventListener("keydown", e => {
  if ((e.target instanceof Element && e.target.closest("input, textarea, select, [contenteditable]")) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "j") move(1);
  else if (e.key === "k") move(-1);
  else if (e.key === "f") setFollow(!S.follow);
  else if (e.key === "p") setPaused(!S.paused);
  else if (e.key === "r") { S.tab = S.tab === "raw" ? "conversation" : "raw"; renderDetail(); }
  else return;
  e.preventDefault();
});
setInterval(scheduleTimeline, 10000); // keep "12s ago" fresh

(async function init() {
  try { S.config = await getJSON("/api/config"); } catch (e) {}
  compileRules();
  if (S.config.mode === "load") document.title = "Proxy Traffic (replay)";
  try { await loadAll(); } catch (e) { setConn("offline"); }
  connect();
})();
</script>
